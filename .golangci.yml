---
version: "2"
run:
  go: "1.25"
  issues-exit-code: 1
  tests: true
linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - dogsled
    - dupl
    - errcheck
    - funlen
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - goheader
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: errors
              desc: Please use "github.com/pkg/errors" instead of "errors" in go imports
    dupl:
      threshold: 150
    errcheck:
      check-type-assertions: false
      check-blank: false
    funlen:
      lines: 100
      statements: 50
    goconst:
      min-len: 2
      min-occurrences: 3
    gocritic:
      enabled-checks:
        - appendCombine
        - boolExprSimplify
        - builtinShadow
        - commentedOutCode
        - commentedOutImport
        - docStub
        - dupImport
        - emptyFallthrough
        - emptyStringTest
        - equalFold
        - evalOrder
        - hexLiteral
        - hugeParam
        - importShadow
        - indexAlloc
        - initClause
        - methodExprCall
        - nestingReduce
        - nilValReturn
        - octalLiteral
        - paramTypeCombine
        - rangeExprCopy
        - rangeValCopy
        - regexpPattern
        - sloppyReassign
        - stringXbytes
        - typeAssertChain
        - typeUnparen
        - unlabelStmt
        - unnamedResult
        - unnecessaryBlock
        - weakCond
        - yodaStyleExpr
    gocyclo:
      min-complexity: 15
    goheader:
      values:
        regexp:
          company: .*
          copyright-holder: Copyright \(c\) ({{mod-year-range}}) {{company}}\n\n
          copyright-holders: ({{copyright-holder}})+
      template-path: .ci/license/template.txt
    gosec:
      excludes:
        - G115
        - G304
        - G702
        - G703
    govet:
      enable:
        - shadow
      settings:
        printf:
          funcs:
            - (github.com/sirupsen/logrus.FieldLogger).Infof
            - (github.com/sirupsen/logrus.FieldLogger).Warnf
            - (github.com/sirupsen/logrus.FieldLogger).Errorf
            - (github.com/sirupsen/logrus.FieldLogger).Fatalf
      disable:
        - inline
    lll:
      line-length: 160
    misspell:
      locale: US
    nakedret:
      max-func-lines: 30
    prealloc:
      simple: true
      range-loops: true
      for-loops: false
    revive:
      confidence: 0.8
      rules:
        - name: exported
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: var-naming
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: superfluous-else
        - name: unreachable-code
    unparam:
      check-exported: false
    staticcheck:
      checks:
        - all
        - -SA4023
        - -QF*
  exclusions:
    generated: lax
    rules:
      - linters:
          - gosec
        path: .*_test.go
      - linters:
          - gocritic
        path: pkg/tools/cgroup/fake_cgroup.go
      - linters:
          - gocritic
        path: pkg/networkservice/common/resourcepool/common.go
      - linters:
          - goconst
        path: (_test\.go|/testutil/)
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/networkservicemesh/sdk-sriov
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
